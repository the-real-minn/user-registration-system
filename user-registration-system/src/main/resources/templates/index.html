<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>FIDES ID Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .content { margin-left: 0; }
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #e8eef8 0%, #f5f7fb 45%, #dfe9f5 100%);
        }
    </style>
</head>
<body>
<div class="hero">
    <div class="card shadow p-5 text-center" style="max-width:480px;">
        <h1 class="h3 mb-2">FIDES ID Management</h1>
        <p class="text-muted mb-4">VPN &amp; login credentials for financial institutions</p>
        <div class="d-grid gap-2">
            <a class="btn btn-primary" th:href="@{/login}">Login</a>
            <a class="btn btn-outline-secondary" th:href="@{/register}">Register</a>
        </div>
    </div>
</div>
</body>
</html>

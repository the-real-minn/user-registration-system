<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Batch Result Notices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0">PDF preview (<span th:text="${#lists.size(notices)}">0</span> bank(s))</h2>
        <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-outline-secondary" th:href="@{/fides/notices/new}">New batch</a>
            <form method="post" th:action="@{/fides/notices/batch/export-pdf}" class="d-inline">
                <button class="btn btn-primary" type="submit">
                    Download ZIP (1 PDF per BIC)
                </button>
            </form>
        </div>
    </div>

    <p class="text-muted">
        Preview each bank PDF below. Click <strong>Download ZIP</strong> to get one zip file.
        Inside the zip: <code>CBMYMMMY.pdf</code>, <code>MYEBMMMY.pdf</code>, … (one PDF per BIC).
    </p>

    <div class="notice-report mb-4" th:each="notice : ${notices}">
        <div class="card shadow p-3">
            <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                <div>
                    <span class="field-highlight px-2 fw-semibold" th:text="${notice.financialInstitution.fiCode}">BIC</span>
                    <span class="ms-2" th:text="${notice.financialInstitution.bankName}">Bank</span>
                </div>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/fides/notices/{id}/pdf(id=${notice.id})}"
                   target="_blank">
                    Open PDF
                </a>
            </div>
            <iframe class="pdf-preview"
                    th:src="@{/fides/notices/{id}/pdf(id=${notice.id})}"
                    title="PDF preview"></iframe>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

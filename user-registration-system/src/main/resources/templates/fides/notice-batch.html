<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Batch Result Notices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0">Generated reports (<span th:text="${#lists.size(notices)}">0</span>)</h2>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/fides/notices/new}">New batch</a>
            <a class="btn btn-primary" th:href="@{/fides/notices/batch/print}" target="_blank">Print all</a>
        </div>
    </div>

    <div class="notice-report mb-4" th:each="notice : ${notices}" th:object="${notice}">
        <div class="card shadow p-4 notice-card">
            <div class="notice-title-bar text-center mb-2">
                CBM-FIDE VPN ID &amp; Login User ID Notice
            </div>
            <div class="text-end text-muted mb-3" th:text="*{noticeDate}"></div>

            <p><strong>BIC Code:</strong>
                <span class="field-highlight px-2" th:text="*{financialInstitution.fiCode}"></span></p>
            <p><strong>FI Name:</strong>
                <span th:text="*{financialInstitution.bankName}"></span></p>

            <hr>
            <p><strong>VPN:</strong>
                <span class="field-highlight px-2" th:text="*{vpnStatus}"></span></p>
            <table class="table table-bordered">
                <tr><th style="width:35%">ID</th><td th:text="*{vpnUserId}"></td></tr>
                <tr><th>Password</th><td><code th:text="*{vpnPassword}"></code></td></tr>
                <tr><th>Pre-Shared Key</th><td><code th:text="*{vpnPsk}"></code></td></tr>
            </table>

            <hr>
            <p><strong>FIDES Login:</strong>
                <span class="field-highlight px-2" th:text="*{fidesLoginStatus}"></span></p>
            <table class="table table-bordered">
                <tr>
                    <th style="width:35%">User Category</th>
                    <td class="field-highlight" th:text="*{userCategory}"></td>
                </tr>
                <tr><th>Login ID</th><td th:text="*{loginUserId}"></td></tr>
                <tr><th>Password</th><td><code th:text="*{loginPassword}"></code></td></tr>
            </table>

            <div class="password-ref small text-muted mt-2">
                <strong>Password Reference:</strong>
                ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789
                !@#$%^&amp;*()-_+[]{}|
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

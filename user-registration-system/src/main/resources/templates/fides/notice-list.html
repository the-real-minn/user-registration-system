<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notice History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Result Notice History</h2>
        <a class="btn btn-primary" th:href="@{/fides/notices/new}">New Notice</a>
    </div>

    <div class="table-responsive card shadow p-3">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>Date</th>
                <th>BIC</th>
                <th>FI Name</th>
                <th>Category</th>
                <th>VPN</th>
                <th>Login</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="n : ${notices}">
                <td th:text="${n.noticeDate}"></td>
                <td th:text="${n.financialInstitution.fiCode}"></td>
                <td th:text="${n.financialInstitution.bankName}"></td>
                <td th:text="${n.userCategory}"></td>
                <td th:text="${n.vpnStatus}"></td>
                <td th:text="${n.fidesLoginStatus}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/fides/notices/{id}(id=${n.id})}">View</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/fides/notices/{id}/print(id=${n.id})}" target="_blank">Print</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(notices)}">
                <td colspan="7" class="text-center text-muted py-4">No notices yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

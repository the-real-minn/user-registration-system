<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${mode == 'create'} ? 'New Institution' : 'Edit Institution'">Institution</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">
    <h2 th:text="${mode == 'create'} ? 'New Financial Institution' : 'Edit Financial Institution'"></h2>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow p-4" style="max-width:640px;">
        <form method="post"
              th:object="${institution}"
              th:action="${mode == 'create'} ? @{/fides/institutions} : @{/fides/institutions/{id}(id=*{id})}">
            <div class="mb-3">
                <label class="form-label">FI Code (BIC)</label>
                <input class="form-control" th:field="*{fiCode}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Bank Name</label>
                <input class="form-control" th:field="*{bankName}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Short Title</label>
                <input class="form-control" th:field="*{shortTitle}">
            </div>
            <div class="mb-3">
                <label class="form-label">Sort Order</label>
                <input class="form-control" type="number" th:field="*{sortOrder}">
            </div>
            <div class="mb-3">
                <label class="form-label">Row Highlight</label>
                <select class="form-select" th:field="*{rowHighlight}">
                    <option th:each="h : ${highlights}" th:value="${h}" th:text="${h}"></option>
                </select>
            </div>
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-link" th:href="@{/fides/institutions}">Cancel</a>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

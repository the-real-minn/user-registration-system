<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Institution Credentials</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">
    <a th:href="@{/fides/institutions}">&larr; Back</a>

    <div th:if="${success}" class="alert alert-success mt-3" th:text="${success}"></div>

    <div class="d-flex justify-content-between align-items-start mt-2 flex-wrap gap-2">
        <div>
            <h2 class="mb-1" th:text="${institution.bankName}">Bank</h2>
            <p class="text-muted mb-0">
                FI Code: <strong th:text="${institution.fiCode}"></strong>
                · Short Title: <strong th:text="${institution.shortTitle}"></strong>
            </p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/fides/institutions/{id}/edit(id=${institution.id})}">Edit FI</a>
            <a class="btn btn-primary" th:href="@{/fides/notices/new(fiId=${institution.id})}">Create Notice</a>
        </div>
    </div>

    <h5 class="mt-4">Credentials</h5>
    <div class="table-responsive card shadow p-3">
        <table class="table table-bordered align-middle mb-0">
            <thead>
            <tr>
                <th>System</th>
                <th>User ID</th>
                <th>Password</th>
                <th>PSK</th>
                <th>Update Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${credentials}">
                <td th:text="${c.systemType.displayName}">VPN</td>
                <td th:text="${c.userId}">id</td>
                <td><code th:text="${c.password}">pwd</code></td>
                <td><code th:text="${c.preSharedKey}">psk</code></td>
                <td th:text="${c.updateDate}">date</td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/fides/institutions/{fiId}/credentials/edit(fiId=${institution.id}, credentialId=${c.id})}">Edit</a>
                    <form class="d-inline" method="post"
                          th:action="@{/fides/credentials/{id}/generate(id=${c.id})}">
                        <input type="hidden" name="institutionId" th:value="${institution.id}">
                        <input type="hidden" name="type" value="password">
                        <button class="btn btn-sm btn-outline-primary" type="submit">Password</button>
                    </form>
                    <form class="d-inline" method="post"
                          th:action="@{/fides/credentials/{id}/generate(id=${c.id})}">
                        <input type="hidden" name="institutionId" th:value="${institution.id}">
                        <input type="hidden" name="type" value="userId">
                        <button class="btn btn-sm btn-outline-dark" type="submit">User ID</button>
                    </form>
                    <form class="d-inline" method="post"
                          th:if="${c.systemType.code.name() == 'VPN'}"
                          th:action="@{/fides/credentials/{id}/generate(id=${c.id})}">
                        <input type="hidden" name="institutionId" th:value="${institution.id}">
                        <input type="hidden" name="type" value="psk">
                        <button class="btn btn-sm btn-outline-warning" type="submit">PSK</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(credentials)}">
                <td colspan="6" class="text-center text-muted py-4">No credentials for this institution.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <h5 class="mt-4">Notice History</h5>
    <div class="table-responsive card shadow p-3">
        <table class="table table-sm mb-0">
            <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>VPN</th>
                <th>Login</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="n : ${notices}">
                <td th:text="${n.noticeDate}"></td>
                <td th:text="${n.userCategory}"></td>
                <td th:text="${n.vpnStatus}"></td>
                <td th:text="${n.fidesLoginStatus}"></td>
                <td>
                    <a th:href="@{/fides/notices/{id}(id=${n.id})}">View</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(notices)}">
                <td colspan="5" class="text-muted text-center py-3">No notices for this FI.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <form class="mt-4" method="post" th:action="@{/fides/institutions/{id}/delete(id=${institution.id})}"
          onsubmit="return confirm('Delete this institution and its credentials?');">
        <button class="btn btn-outline-danger btn-sm" type="submit">Delete Institution</button>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

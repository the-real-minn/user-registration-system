<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Print Result Notices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; padding: 24px; color: #111; }
        .notice-page { max-width: 720px; margin: 0 auto 32px; page-break-after: always; }
        .notice-page:last-child { page-break-after: auto; }
        .title-bar {
            background: #111; color: #fff; text-align: center;
            padding: 10px 12px; font-weight: 700; margin-bottom: 16px;
        }
        .field-highlight { background: #fff3b0; padding: 2px 8px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
        th, td { border: 1px solid #333; padding: 8px 10px; }
        th { width: 35%; background: #f3f3f3; text-align: left; }
        .ref { font-size: 12px; margin-top: 18px; word-break: break-all; }
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; }
        }
    </style>
</head>
<body>
<div class="no-print mb-3">
    <button class="btn btn-primary" onclick="window.print()">Print</button>
    <a class="btn btn-link" th:href="@{/fides/notices/batch}">Back</a>
    <span class="ms-2 text-muted" th:text="'Reports: ' + ${#lists.size(notices)}"></span>
</div>

<div class="notice-page" th:each="notice : ${notices}" th:object="${notice}">
    <div class="title-bar">CBM-FIDE VPN ID &amp; Login User ID Notice</div>
    <div class="text-end mb-3" th:text="*{noticeDate}"></div>

    <p><strong>BIC Code:</strong>
        <span class="field-highlight" th:text="*{financialInstitution.fiCode}"></span></p>
    <p><strong>FI Name:</strong>
        <span th:text="*{financialInstitution.bankName}"></span></p>

    <p><strong>VPN:</strong>
        <span class="field-highlight" th:text="*{vpnStatus}"></span></p>
    <table>
        <tr><th>ID</th><td th:text="*{vpnUserId}"></td></tr>
        <tr><th>Password</th><td th:text="*{vpnPassword}"></td></tr>
        <tr><th>Pre-Shared Key</th><td th:text="*{vpnPsk}"></td></tr>
    </table>

    <p><strong>FIDES Login:</strong>
        <span class="field-highlight" th:text="*{fidesLoginStatus}"></span></p>
    <table>
        <tr><th>User Category</th><td class="field-highlight" th:text="*{userCategory}"></td></tr>
        <tr><th>Login ID</th><td th:text="*{loginUserId}"></td></tr>
        <tr><th>Password</th><td th:text="*{loginPassword}"></td></tr>
    </table>

    <div class="ref">
        <strong>Password Reference:</strong><br>
        ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789<br>
        !@#$%^&amp;*()-_+[]{}|
    </div>
</div>
</body>
</html>

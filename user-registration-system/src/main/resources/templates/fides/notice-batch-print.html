<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Print Result Notices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, Helvetica, sans-serif; padding: 24px; color: #111; }
        .notice-page { max-width: 720px; margin: 0 auto 32px; page-break-after: always; }
        .notice-page:last-child { page-break-after: auto; }
        .title-bar {
            background: #000; color: #fff; text-align: center;
            display: flex; align-items: center; justify-content: center;
            min-height: 40px; padding: 0 12px; font-weight: 700; margin-bottom: 12px;
        }
        .info-row { display: flex; align-items: baseline; margin: 0 0 6px; }
        .info-label { width: 110px; flex-shrink: 0; font-weight: 700; }
        .bank-info { margin-bottom: 8px; }
        hr.sep { border: 0; border-top: 1px solid #000; margin: 12px 0 16px; }
        table { width: 100%; border-collapse: collapse; margin: 6px 0 16px; }
        th, td { border: 1px solid #000; padding: 8px 10px; }
        th { width: 35%; background: #e6e6e6; text-align: left; font-weight: 700; }
        .ref { font-size: 12px; font-weight: 700; margin-top: 18px; word-break: break-all; }
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; }
        }
    </style>
</head>
<body>
<div class="no-print mb-3">
    <button class="btn btn-primary" onclick="window.print()">Print</button>
    <a class="btn btn-link" th:href="@{/fides/notices/batch}">Back</a>
    <span class="ms-2 text-muted" th:text="'Reports: ' + ${#lists.size(notices)}"></span>
</div>

<div class="notice-page" th:each="notice : ${notices}">
    <div class="title-bar">CBM-FIDE VPN ID &amp; Login User ID Notice</div>
    <div class="text-end mb-3" th:text="${#temporals.format(notice.noticeDate, 'dd/MM/yyyy')}"></div>

    <div class="bank-info">
        <div class="info-row">
            <span class="info-label">BIC Code:</span>
            <span th:text="${notice.financialInstitution.fiCode}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">FI Name:</span>
            <span th:text="${notice.financialInstitution.bankName}"></span>
        </div>
    </div>
    <hr class="sep">

    <div class="info-row">
        <span class="info-label">VPN:</span>
        <span th:text="${notice.vpnStatus}"></span>
    </div>
    <table>
        <tr>
            <th>ID</th>
            <td th:text="${notice.vpnStatus == 'No Change' or notice.vpnStatus == 'Pre-Shared Key Change' ? 'N/A' : notice.vpnUserId}"></td>
        </tr>
        <tr>
            <th>Password</th>
            <td th:text="${notice.vpnStatus == 'No Change' or notice.vpnStatus == 'Pre-Shared Key Change' ? 'N/A' : notice.vpnPassword}"></td>
        </tr>
        <tr>
            <th>Pre-Shared Key</th>
            <td th:text="${notice.vpnStatus == 'No Change' ? 'N/A' : notice.vpnPsk}"></td>
        </tr>
    </table>

    <div class="info-row">
        <span class="info-label">FIDES Login:</span>
        <span th:text="${notice.fidesLoginStatus}"></span>
    </div>
    <table>
        <tr><th>User Category</th><td th:text="${notice.userCategory}"></td></tr>
        <tr>
            <th>Login ID</th>
            <td th:text="${notice.fidesLoginStatus == 'No Change' ? 'N/A' : notice.loginUserId}"></td>
        </tr>
        <tr>
            <th>Password</th>
            <td th:text="${notice.fidesLoginStatus == 'No Change' ? 'N/A' : notice.loginPassword}"></td>
        </tr>
    </table>

    <div class="ref">
        Password Reference:<br>
        ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz123456789!@#$%^&amp;*()-+[]_
    </div>
</div>
</body>
</html>

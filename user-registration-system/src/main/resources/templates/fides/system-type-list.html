<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>System Types</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0">System Types</h2>
        <a class="btn btn-primary" th:href="@{/fides/system-types/new}">Add System Type</a>
    </div>

    <div class="card shadow p-3">
        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Display Name</th>
                    <th>ID Suffix</th>
                    <th>Sort Order</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="st : ${systemTypes}">
                    <td><code th:text="${st.code}"></code></td>
                    <td th:text="${st.displayName}"></td>
                    <td><code th:text="${st.idSuffix}"></code></td>
                    <td th:text="${st.sortOrder}"></td>
                    <td>
                        <span class="badge" th:classappend="${st.active} ? 'bg-success' : 'bg-secondary'"
                              th:text="${st.active} ? 'Active' : 'Inactive'"></span>
                    </td>
                    <td class="text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/fides/system-types/{id}/edit(id=${st.id})}">Edit</a>
                        <form class="d-inline" method="post"
                              th:action="@{/fides/system-types/{id}/toggle(id=${st.id})}">
                            <button class="btn btn-sm btn-outline-primary" type="submit"
                                    th:text="${st.active} ? 'Deactivate' : 'Activate'"></button>
                        </form>
                        <form class="d-inline" method="post"
                              th:action="@{/fides/system-types/{id}/delete(id=${st.id})}"
                              onsubmit="return confirm('Delete this system type?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(systemTypes)}">
                    <td colspan="6" class="text-center text-muted py-4">No system types defined.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Print Notice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 32px; font-family: "Segoe UI", Arial, sans-serif; }
        .field-highlight { background: #fff3b0; padding: 2px 8px; }
        h2 { text-align: center; margin-bottom: 24px; }
        table { width: 100%; margin-bottom: 16px; }
        th { width: 35%; background: #f8f9fa; }
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body th:object="${notice}">
<div class="no-print mb-3">
    <button class="btn btn-primary" onclick="window.print()">Print</button>
    <a class="btn btn-link" th:href="@{/fides/notices/{id}(id=${notice.id})}">Back</a>
</div>

<h2>CBM-FIDE VPN ID &amp; Login User ID Notice</h2>
<div class="text-end mb-3" th:text="*{noticeDate}"></div>

<p><strong>BIC Code:</strong> <span class="field-highlight" th:text="*{financialInstitution.fiCode}"></span></p>
<p><strong>FI Name:</strong> <span th:text="*{financialInstitution.bankName}"></span></p>

<p><strong>VPN:</strong> <span class="field-highlight" th:text="*{vpnStatus}"></span></p>
<table class="table table-bordered">
    <tr><th>ID</th><td th:text="*{vpnUserId}"></td></tr>
    <tr><th>Password</th><td th:text="*{vpnPassword}"></td></tr>
    <tr><th>Pre-Shared Key</th><td th:text="*{vpnPsk}"></td></tr>
</table>

<p><strong>FIDES Login:</strong> <span class="field-highlight" th:text="*{fidesLoginStatus}"></span></p>
<table class="table table-bordered">
    <tr><th>User Category</th><td class="field-highlight" th:text="*{userCategory}"></td></tr>
    <tr><th>Login ID</th><td th:text="*{loginUserId}"></td></tr>
    <tr><th>Password</th><td th:text="*{loginPassword}"></td></tr>
</table>

<div class="mt-4 small">
    <strong>Password Reference:</strong><br>
    ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789<br>
    !@#$%^&amp;*()-_+[]{}|
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${mode == 'create'} ? 'New System Type' : 'Edit System Type'">System Type</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">
    <h2 th:text="${mode == 'create'} ? 'New System Type' : 'Edit System Type'"></h2>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form method="post"
          th:object="${systemType}"
          th:action="${mode == 'create'} ? @{/fides/system-types} : @{/fides/system-types/{id}(id=*{id})}">

        <div class="card shadow p-4 mb-4" style="max-width: 640px;">
            <div class="mb-3">
                <label class="form-label">Code <span class="text-danger">*</span></label>
                <select class="form-select" th:field="*{code}" th:disabled="${mode == 'edit'}" required>
                    <option value="">Select code</option>
                    <option th:each="c : ${codes}"
                            th:value="${c}"
                            th:text="${c.name() + ' - ' + c.getDisplayName()}"></option>
                </select>
                <div class="form-text">Code is fixed after creation. VPN, PSS2 (CBM-NET), Inter-Bank, Mobile Wallet, Bank Fraud, MIB.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Display Name <span class="text-danger">*</span></label>
                <input class="form-control" th:field="*{displayName}" required placeholder="e.g., VPN, CBM-NET related">
            </div>

            <div class="mb-3">
                <label class="form-label">ID Suffix</label>
                <input class="form-control" th:field="*{idSuffix}" placeholder="e.g., VPN, PSS, IBR, MW, BFR, MIB">
                <div class="form-text">Optional suffix used when generating User IDs (e.g., LEFT(fi_code,4) + suffix)</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Sort Order</label>
                <input class="form-control" type="number" th:field="*{sortOrder}" min="1">
                <div class="form-text">Display order in forms and lists</div>
            </div>

            <div class="mb-3 form-check form-switch">
                <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                <label class="form-check-label" for="active">Active (show in institution forms)</label>
            </div>
        </div>

        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-link" th:href="@{/fides/system-types}">Cancel</a>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

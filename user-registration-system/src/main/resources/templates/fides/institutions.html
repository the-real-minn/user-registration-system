<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>FIDES Institutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0">Financial Institutions</h2>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/fides/import}">Import Excel</a>
            <a class="btn btn-outline-success" th:href="@{/fides/notices/new}">Result Notice</a>
            <a class="btn btn-primary" th:href="@{/fides/institutions/new}">Add FI</a>
        </div>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/fides/institutions}">
        <div class="col-auto">
            <input class="form-control" type="search" name="q" th:value="${q}"
                   placeholder="Search FI Code or Bank Name">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
    </form>

    <div class="table-responsive card shadow p-3">
        <table class="table table-sm table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>#</th>
                <th>FI Code</th>
                <th>Bank Name</th>
                <th>Short Title</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="fi : ${institutions}"
                th:classappend="${fi.rowHighlight.name() == 'HIGHLIGHT_RED'} ? 'table-danger' :
                                (${fi.rowHighlight.name() == 'HIGHLIGHT_YELLOW'} ? 'table-warning' : '')">
                <td th:text="${fi.sortOrder}">1</td>
                <td th:text="${fi.fiCode}">CODE</td>
                <td th:text="${fi.bankName}">Name</td>
                <td th:text="${fi.shortTitle}">ST</td>
                <td th:text="${fi.rowHighlight}">NORMAL</td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/fides/institutions/{id}(id=${fi.id})}">Credentials</a>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/fides/notices/new(fiId=${fi.id})}">Notice</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(institutions)}">
                <td colspan="6" class="text-center text-muted py-4">
                    No institutions yet. Import the Excel User ID sheet first.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Credential</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">
    <h2>Edit Credential</h2>
    <p class="text-muted" th:text="${institution.bankName + ' (' + institution.fiCode + ')'}"></p>

    <div class="card shadow p-4" style="max-width:640px;">
        <form method="post" th:action="@{/fides/institutions/{fiId}/credentials(fiId=${institution.id})}">
            <div class="mb-3">
                <label class="form-label">System</label>
                <select class="form-select" name="systemTypeId" required>
                    <option th:each="t : ${systemTypes}"
                            th:value="${t.id}"
                            th:text="${t.displayName}"
                            th:selected="${credential.systemType != null and credential.systemType.id == t.id}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">User ID</label>
                <input class="form-control" name="userId" th:value="${credential.userId}">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" name="password" th:value="${credential.password}">
            </div>
            <div class="mb-3">
                <label class="form-label">Pre-Shared Key (VPN only)</label>
                <input class="form-control" name="preSharedKey" th:value="${credential.preSharedKey}">
            </div>
            <div class="mb-3">
                <label class="form-label">Update Date</label>
                <input class="form-control" type="date" name="updateDate" th:value="${credential.updateDate}">
            </div>
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-link" th:href="@{/fides/institutions/{id}(id=${institution.id})}">Cancel</a>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

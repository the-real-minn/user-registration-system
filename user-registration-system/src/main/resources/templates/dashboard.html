<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">
    <h2>Dashboard</h2>
    <p class="text-muted">Welcome, <span th:text="${user.username}"></span></p>

    <div class="row g-3 mt-2">
        <div class="col-md-4">
            <a class="card shadow p-4 text-decoration-none text-dark d-block h-100" th:href="@{/fides/institutions}">
                <h5>Institutions</h5>
                <p class="mb-0 text-muted">View and manage FI credentials (User ID sheet).</p>
            </a>
        </div>
        <div class="col-md-4">
            <a class="card shadow p-4 text-decoration-none text-dark d-block h-100" th:href="@{/fides/notices/new}">
                <h5>Result Notice</h5>
                <p class="mb-0 text-muted">Generate VPN &amp; login notice with password tools.</p>
            </a>
        </div>
        <div class="col-md-4">
            <a class="card shadow p-4 text-decoration-none text-dark d-block h-100" th:href="@{/fides/import}">
                <h5>Import Excel</h5>
                <p class="mb-0 text-muted">Load data from FIDES ID Management.xlsx.</p>
            </a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
